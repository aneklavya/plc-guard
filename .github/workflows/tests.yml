name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      # Offline: LLM tests use fake responses, no API key is needed or available.
      - run: python -m pytest -q
      # Cached LLM replies must reproduce the committed results without a key.
      - run: python -m plcguard eval --no-log --out /tmp/rules
